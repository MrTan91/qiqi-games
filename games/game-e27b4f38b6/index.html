<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data: blob:; media-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'"><title>猫猫定身挑战</title><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>猫猫定身挑战</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#1a1420;color:#ffd6e8;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;user-select:none}h1{margin:12px 0 4px;font-size:20px;color:#ff9ecb}#info{font-size:14px;margin-bottom:6px}canvas{background:#241b2e;border:2px solid #ff9ecb;border-radius:12px;touch-action:none}#hint{font-size:12px;color:#b893a8;margin-top:8px}</style></head><body><h1>🐾 猫猫定身挑战</h1><div id="info">存活：<span id="t">0.0</span>s　最高：<span id="best">0.0</span>s</div><canvas id="c" width="320" height="420"></canvas><div id="hint">按住屏幕定身躲猫猫　松开恢复</div><script>var cv=document.getElementById('c'),g=cv.getContext('2d');var px=160,py=360,cats=[],t0=0,alive=false,best=0,freeze=0,cool=0,pressed=false;function spawn(){cats.push({x:Math.random()*280+20,y:-20,v:1.2+Math.random()*1.5})}function reset(){cats=[];px=160;py=360;t0=performance.now();alive=true;freeze=0;cool=0}cv.addEventListener('pointerdown',function(){if(!alive)reset();pressed=true});window.addEventListener('pointerup',function(){pressed=false});function loop(now){g.clearRect(0,0,320,420);if(!alive){g.fillStyle='#ffd6e8';g.font='16px sans-serif';g.textAlign='center';g.fillText('点一下开始',160,200);g.font='12px sans-serif';g.fillText('小猫会追你，按住定身躲开',160,225);requestAnimationFrame(loop);return}var dt=(now-t0)/1000;if(pressed&&cool<=0){freeze=0.4;cool=2}if(pressed&&freeze>0)freeze=0.4;cool=Math.max(0,cool-1/60);if(!pressed||cool>=2){freeze=Math.max(0,freeze-1/60)}if(freeze<=0&&!pressed){var dx=px-160,dy=py-360,d=Math.sqrt(dx*dx+dy*dy)||1;px+=dx/d*1.6;py+=dy/d*1.6;px=Math.max(14,Math.min(306,px));py=Math.max(14,Math.min(406,py))}if(Math.random()<0.03+dt*0.003)spawn();cats.forEach(function(c){if(freeze<=0&&!pressed){var dx=px-c.x,dy=py-c.y,d=Math.sqrt(dx*dx+dy*dy)||1;c.x+=dx/d*c.v;c.y+=dy/d*c.v}else c.y+=c.v*0.3;if(Math.sqrt(Math.pow(c.x-px,2)+Math.pow(c.y-py,2))<18){alive=false;best=Math.max(best,dt);document.getElementById('best').textContent=best.toFixed(1)}});cats=cats.filter(function(c){return c.y<440});g.fillStyle='#ff9ecb';g.beginPath();g.arc(px,py-6,7,Math.PI,0);g.fill();g.beginPath();g.arc(px,py+6,7,0,Math.PI);g.fill();g.fillStyle=freeze>0?'#ff2d78':'#ffd6e8';g.beginPath();g.arc(px,py,9,0,7);g.fill();cats.forEach(function(c){g.fillStyle='#c9b6ff';g.beginPath();g.arc(c.x,c.y,9,0,7);g.fill();g.fillStyle='#241b2e';g.fillRect(c.x-4,c.y-2,3,3);g.fillRect(c.x+1,c.y-2,3,3)});g.fillStyle='#8ff';g.font='11px sans-serif';g.textAlign='center';if(cool>0)g.fillText('定身冷却中…',160,20);document.getElementById('t').textContent=dt.toFixed(1);requestAnimationFrame(loop)}requestAnimationFrame(loop)</script></body></html>
