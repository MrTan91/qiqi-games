<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data: blob:; media-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'"><title>猫猫定身挑战（手机版）</title><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>猫猫定身挑战</title><style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{background:#1a1420;color:#ffd6e8;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;user-select:none;touch-action:none}h1{margin:12px 0 4px;font-size:18px;color:#ff9ecb}#info{font-size:13px;margin-bottom:6px}canvas{background:#241b2e;border:2px solid #ff9ecb;border-radius:14px;touch-action:none}#hint{font-size:12px;color:#b893a8;margin:10px 16px;text-align:center}</style></head><body><h1>🐾 猫猫定身挑战</h1><div id="info">存活 <span id="t">0.0</span>s　最高 <span id="best">0.0</span>s</div><canvas id="c" width="320" height="420"></canvas><div id="hint">按住屏幕：爱心瞳定身（有冷却）　松开就跑</div><script>var cv=document.getElementById('c'),g=cv.getContext('2d');function fit(){var s=Math.min((window.innerWidth-24)/320,(window.innerHeight-170)/420);cv.style.width=(320*s)+'px';cv.style.height=(420*s)+'px'}window.addEventListener('resize',fit);fit();var px=160,py=360,cats=[],t0=0,alive=false,best=0,freeze=0,cool=0,pressed=false;function spawn(){cats.push({x:Math.random()*280+20,y:-20,v:1.1+Math.random()*1.4})}function reset(){cats=[];px=160;py=360;t0=performance.now();alive=true;freeze=0;cool=0}cv.addEventListener('pointerdown',function(e){e.preventDefault();if(!alive)reset();pressed=true},{passive:false});window.addEventListener('pointerup',function(){pressed=false});window.addEventListener('pointercancel',function(){pressed=false});function loop(now){g.clearRect(0,0,320,420);if(!alive){g.fillStyle='#ffd6e8';g.font='18px sans-serif';g.textAlign='center';g.fillText('点一下开始',160,190);g.font='13px sans-serif';g.fillStyle='#c9a8bd';g.fillText('小猫会追你',160,218);g.fillText('按住屏幕定身躲开',160,240);if(best>0){g.fillStyle='#8ff';g.fillText('上次 '+best.toFixed(1)+'s',160,275)}requestAnimationFrame(loop);return}var dt=(now-t0)/1000;if(pressed&&cool<=0&&freeze<=0){freeze=0.5;cool=2.2}cool=Math.max(0,cool-1/60);freeze=Math.max(0,freeze-1/60);if(freeze<=0){var dx=px-160,dy=py-360,d=Math.sqrt(dx*dx+dy*dy)||1;px+=dx/d*1.7;py+=dy/d*1.7;px=Math.max(14,Math.min(306,px));py=Math.max(14,Math.min(406,py))}if(Math.random()<0.028+dt*0.003)spawn();for(var i=0;i<cats.length;i++){var c=cats[i];if(freeze<=0){var ax=px-c.x,ay=py-c.y,ad=Math.sqrt(ax*ax+ay*ay)||1;c.x+=ax/ad*c.v;c.y+=ay/ad*c.v}else{c.y+=c.v*0.25}if(Math.sqrt(Math.pow(c.x-px,2)+Math.pow(c.y-py,2))<18){alive=false;best=Math.max(best,dt);document.getElementById('best').textContent=best.toFixed(1)}}var keep=[];for(var j=0;j<cats.length;j++){if(cats[j].y<450)keep.push(cats[j])}cats=keep;g.fillStyle='#ff9ecb';g.beginPath();g.arc(px,py-6,7,Math.PI,0);g.fill();g.beginPath();g.arc(px,py+6,7,0,Math.PI);g.fill();g.fillStyle=freeze>0?'#ff2d78':'#ffd6e8';g.beginPath();g.arc(px,py,9,0,7);g.fill();for(var k=0;k<cats.length;k++){var cc=cats[k];g.fillStyle='#c9b6ff';g.beginPath();g.arc(cc.x,cc.y,9,0,7);g.fill();g.fillStyle='#241b2e';g.fillRect(cc.x-4,cc.y-2,3,3);g.fillRect(cc.x+1,cc.y-2,3,3)}g.fillStyle='#8ff';g.font='12px sans-serif';g.textAlign='center';if(cool>0)g.fillText('冷却 '+cool.toFixed(1),160,18);document.getElementById('t').textContent=dt.toFixed(1);requestAnimationFrame(loop)}requestAnimationFrame(loop);</script></body></html>
